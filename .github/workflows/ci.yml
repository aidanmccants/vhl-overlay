# Runs the checks and tests on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release-notes tests read the git history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Check the extension
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests
        run: npm run test:e2e
