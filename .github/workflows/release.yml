# Builds VHL-Text-Overlay.zip and publishes it as a GitHub release.
# Run it from the Actions tab ("Publish release" → "Run workflow"),
# or push a tag like v1.0.0.
name: Publish release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: v
        run: echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          mkdir -p dist/"VHL Text Overlay"
          cp -r extension/. dist/"VHL Text Overlay"/
          cd dist && zip -r VHL-Text-Overlay.zip "VHL Text Overlay"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          name: VHL Text Overlay ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/VHL-Text-Overlay.zip
          body: |
            **To install:** download **VHL-Text-Overlay.zip** below, then follow the steps in the
            [instructions](https://github.com/${{ github.repository }}#readme).

            **Para instalar:** descargue **VHL-Text-Overlay.zip** (abajo) y siga las
            [instrucciones](https://github.com/${{ github.repository }}#español).
