# Publishes a release to GitHub Releases.
#
# Two ways to start it:
#   1. Actions tab → "Publish release" → Run workflow, and pick how to bump the
#      version (patch / minor / major), or "none" to release the current version.
#   2. Locally: `npm run release -- patch`, then push the commit and the tag.
#
# Either way it runs every check and test (about 2 minutes), builds
# VHL-Text-Overlay.zip, writes the release notes from the git history and
# publishes the release. The slower mutation check runs on pull requests instead
# (see ci.yml), before changes reach main.
name: Publish release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to change the version
        type: choice
        options: [patch, minor, major, none]
        default: patch
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Check, unit tests and browser tests
        run: |
          npm run check
          npm run test:unit
          npm run test:e2e

      - name: Bump the version, update CHANGELOG.md, commit and tag
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs prepare ${{ inputs.bump }} --skip-tests
          git push origin HEAD --follow-tags

      - name: Build the zip and release notes
        run: |
          node scripts/release.mjs build
          node scripts/release.mjs notes

      - name: Read the version
        id: v
        run: echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.v.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${{ steps.v.outputs.version }}" >&2
            exit 1
          fi

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: VHL Text Overlay ${{ steps.v.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/VHL-Text-Overlay.zip
            dist/VHL-Text-Overlay.zip.sha256
