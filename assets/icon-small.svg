<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8bff"/>
      <stop offset=".55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#e14fd0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".15" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".14"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2a1170" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- squircle tile -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#glow)"/>
  <!-- T with caret -->
  <g filter="url(#shadow)" fill="#fff">
    <rect x="18" y="26" width="72" height="20" rx="10"/>
    <rect x="44" y="26" width="20" height="78" rx="10"/>
    <rect x="98" y="32" width="12" height="66" rx="6" fill="#ffe066"/>
  </g>
  <!-- rim highlight -->
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
</svg>
